# 无本机 MySQL 时的演示配置：mvn spring-boot:run -Dspring-boot.run.profiles=demo
spring:
  datasource:
    url: jdbc:h2:mem:bid_platform;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:demo/schema-h2.sql
      data-locations: classpath:demo/seed-h2.sql

mybatis:
  configuration:
    map-underscore-to-camel-case: true
